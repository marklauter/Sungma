[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes-siv = "0.8.0"
aws-sdk-dynamodb = { version = "1.130.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum = "0.8.9"
divan = "0.1.21"
getrandom = "0.4.3"
http-body-util = "0.1.5"
libc = "0.2.190"
parking_lot = "0.12.3"
proptest = "1.11.0"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sungma = { version = "0.1.0", path = "crates/sungma" }
sungma-check = { version = "0.1.0", path = "crates/sungma-check" }
sungma-clock = { version = "0.1.0", path = "crates/sungma-clock" }
sungma-table = { version = "0.1.0", path = "crates/sungma-table" }
sungma-dynamodb = { version = "0.1.0", path = "crates/sungma-dynamodb" }
sungma-lang = { version = "0.1.0", path = "crates/sungma-lang" }
sungma-node = { version = "0.1.0", path = "crates/sungma-node" }
sungma-read = { version = "0.1.0", path = "crates/sungma-read" }
sungma-schema = { version = "0.1.0", path = "crates/sungma-schema" }
sungma-names = { version = "0.1.0", path = "crates/sungma-names" }
sungma-write = { version = "0.1.0", path = "crates/sungma-write" }
thiserror = "2.0.21"
tokio = "1.53.2"
tower = "0.5.3"
webpki-roots = "1.0.9"
