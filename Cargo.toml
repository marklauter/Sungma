[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sungma = { version = "0.1.0", path = "crates/sungma" }
sungma-lang = { version = "0.1.0", path = "crates/sungma-lang" }
thiserror = "2.0.21"
tokio = "1.53.2"
tower = "0.5.3"
