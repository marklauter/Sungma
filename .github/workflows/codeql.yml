name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "27 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Each language is analyzed only when its files change, and always on
        # the weekly schedule. Runner minutes are limited. The job itself
        # always runs, so the required Analyze checks still report.
        include:
          - language: actions
            build-mode: none
            paths: '^\.github/'
          - language: rust
            build-mode: none
            paths: '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: ${{ matrix.paths }}
      - name: Initialize CodeQL
        if: steps.changes.outputs.changed == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        if: steps.changes.outputs.changed == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"
