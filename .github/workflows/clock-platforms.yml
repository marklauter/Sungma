name: Clock platforms

# The clocks on real machines: Linux with chrony synced, and NTS over the
# internet on Linux and Windows. Weekly and by hand, not on every change,
# because runner minutes are limited.
on:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust

    - name: Sync the kernel's clock with chrony
      run: |
        sudo apt-get update
        sudo apt-get install -y chrony
        sudo systemctl restart chrony
        # Up to 120 tries a second apart, until the correction is under 10 ms.
        sudo chronyc waitsync 120 0.01 0 1
        chronyc tracking

    - name: The Linux clock reads the kernel's bound
      run: cargo test -p sungma-clock --locked --test platform -- --ignored --nocapture

    - name: NTS against public servers
      run: cargo test -p sungma-clock --locked --test nts public_nts_servers_sync -- --ignored --nocapture

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust

    - name: NTS against public servers
      run: cargo test -p sungma-clock --locked --test nts public_nts_servers_sync -- --ignored --nocapture
