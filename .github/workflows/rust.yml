name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # The jobs below run only when the commits change Rust code, its build
  # settings, the fuzz target or this pipeline. Runner minutes are limited.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - id: rust
      uses: ./.github/actions/changes
      with:
        pattern: '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain\.toml$|^fuzz/|^\.github/(workflows/rust\.yml|actions/)'

  format:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: rustfmt

    - name: Verify formatting
      run: cargo fmt --all --check

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: clippy

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked

    - name: Docs
      run: cargo doc --workspace --no-deps --locked

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        profile: [ dev, release ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust

    - name: Build
      run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }}

    - name: Test
      run: cargo test --workspace --locked --profile ${{ matrix.profile }}

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: llvm-tools-preview
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: cargo-llvm-cov@0.9.1

    - name: Coverage (fails under 95% of lines)
      run: cargo llvm-cov --workspace --locked --fail-under-lines 95

  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: cargo-audit@0.22.2

    - name: Audit dependencies against the RustSec advisory database
      run: cargo audit --deny warnings

  mutants:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-rust
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: cargo-mutants@27.1.0

    # Only the lines a pull request changes, so the existing survivors don't
    # block it, and only when it changes Rust code or its build settings.
    - name: Mutation testing (fails when a mutant of changed code survives)
      if: github.event_name == 'pull_request'
      run: |
        if ! git diff --name-only origin/${{ github.base_ref }}... | grep -Eq '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/'; then
          echo "No Rust changes, skipping mutation testing"
          exit 0
        fi
        git diff origin/${{ github.base_ref }}... > pr.diff
        cargo mutants --workspace --in-diff pr.diff -- --locked

  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # libFuzzer needs a nightly compiler; pinned like every other tool.
      NIGHTLY: nightly-2026-10-01
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install nightly
      run: rustup toolchain install $NIGHTLY --profile minimal
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: cargo-fuzz@0.13.2
    # The corpus a run grows is kept for the next, so each starts where the last left off.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: fuzz-corpus-

    # Seeds and a token dictionary get it past building valid JSON; inputs up
    # to 64 KiB reach larger shapes than libFuzzer's 4 KiB default. The target
    # is named because the prebuilt cargo-fuzz defaults to musl, which the
    # address sanitizer can't build for.
    - name: Fuzz the theory document parser for a minute
      run: >
        mkdir -p fuzz/corpus/document &&
        cargo +$NIGHTLY fuzz run --target x86_64-unknown-linux-gnu
        document fuzz/corpus/document fuzz/seeds/document --
        -dict=fuzz/document.dict -max_len=65536 -max_total_time=60

    - name: Fuzz the fact document parser for a minute
      run: >
        mkdir -p fuzz/corpus/fact &&
        cargo +$NIGHTLY fuzz run --target x86_64-unknown-linux-gnu
        fact fuzz/corpus/fact fuzz/seeds/fact --
        -dict=fuzz/fact.dict -max_len=65536 -max_total_time=60

    # A reply is 48 bytes; the 16 before it are the send and receive times.
    - name: Fuzz the NTP reply parser for 30 seconds
      run: >
        mkdir -p fuzz/corpus/ntp &&
        cargo +$NIGHTLY fuzz run --target x86_64-unknown-linux-gnu
        ntp fuzz/corpus/ntp -- -max_len=64 -max_total_time=30

    - name: Keep the crashing input
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts

  # The single required status check: the ruleset names this job, not the
  # matrix legs. Skipped jobs pass only when there were no Rust changes.
  passed:
    if: always()
    needs: [ changes, format, lint, test, coverage, audit, mutants, fuzz ]
    runs-on: ubuntu-latest
    steps:
    - name: Require every job to succeed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (needs.changes.outputs.rust != 'false' && contains(needs.*.result, 'skipped'))
      run: exit 1
