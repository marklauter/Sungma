name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: rustfmt

    - name: Verify formatting
      run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: clippy

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked

    - name: Docs
      run: cargo doc --workspace --no-deps --locked

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        profile: [ dev, release ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust

    - name: Build
      run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }}

    - name: Test
      run: cargo test --workspace --locked --profile ${{ matrix.profile }}

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: llvm-tools-preview
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-llvm-cov@0.9.1

    - name: Coverage (fails under 95% of lines)
      run: cargo llvm-cov --workspace --locked --fail-under-lines 95

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-audit@0.22.2

    - name: Audit dependencies against the RustSec advisory database
      run: cargo audit --deny warnings

  mutants:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-rust
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-mutants@27.1.0

    # Only the lines a pull request changes, so the existing survivors don't block it.
    - name: Mutation testing (fails when a mutant of changed code survives)
      if: github.event_name == 'pull_request'
      run: |
        git diff origin/${{ github.base_ref }}... > pr.diff
        cargo mutants --workspace --in-diff pr.diff -- --locked

  # The single required status check: the ruleset names this job, not the matrix legs.
  passed:
    if: always()
    needs: [ format, lint, test, coverage, audit, mutants ]
    runs-on: ubuntu-latest
    steps:
    - name: Require every job to succeed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
