name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: rustfmt

    - name: Verify formatting
      run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: clippy

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked

    - name: Docs
      run: cargo doc --workspace --no-deps --locked

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        profile: [ dev, release ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust

    - name: Build
      run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }}

    - name: Test
      run: cargo test --workspace --locked --profile ${{ matrix.profile }}

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: llvm-tools-preview
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-llvm-cov@0.9.1

    - name: Coverage (fails under 95% of lines)
      run: cargo llvm-cov --workspace --locked --fail-under-lines 95

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-audit@0.22.2

    - name: Audit dependencies against the RustSec advisory database
      run: cargo audit --deny warnings

  mutants:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-rust
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-mutants@27.1.0

    # Only the lines a pull request changes, so the existing survivors don't
    # block it, and only when it changes Rust code or its build settings.
    - name: Mutation testing (fails when a mutant of changed code survives)
      if: github.event_name == 'pull_request'
      run: |
        if ! git diff --name-only origin/${{ github.base_ref }}... | grep -Eq '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/'; then
          echo "No Rust changes, skipping mutation testing"
          exit 0
        fi
        git diff origin/${{ github.base_ref }}... > pr.diff
        cargo mutants --workspace --in-diff pr.diff -- --locked

  fuzz:
    runs-on: ubuntu-latest
    env:
      # libFuzzer needs a nightly compiler; pinned like every other tool.
      NIGHTLY: nightly-2026-10-01
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install nightly
      run: rustup toolchain install $NIGHTLY --profile minimal
    - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-fuzz@0.13.2
    # The corpus a run grows is kept for the next, so each starts where the last left off.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: fuzz-corpus-

    # Seeds and a token dictionary get it past building valid JSON; inputs up
    # to 64 KiB reach larger shapes than libFuzzer's 4 KiB default.
    - name: Fuzz the theory document parser for a minute
      run: >
        mkdir -p fuzz/corpus/document &&
        cargo +$NIGHTLY fuzz run document fuzz/corpus/document fuzz/seeds/document --
        -dict=fuzz/document.dict -max_len=65536 -max_total_time=60

    - name: Keep the crashing input
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts

  # The single required status check: the ruleset names this job, not the matrix legs.
  passed:
    if: always()
    needs: [ format, lint, test, coverage, audit, mutants, fuzz ]
    runs-on: ubuntu-latest
    steps:
    - name: Require every job to succeed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
