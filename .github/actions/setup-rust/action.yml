name: Setup Rust
description: Install the stable Rust toolchain with the requested components and restore the cargo cache.

inputs:
  components:
    description: Comma-separated rustup components to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        components: ${{ inputs.components }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
