name: Setup Rust
description: Install the stable Rust toolchain with the requested components and restore the cargo cache.

inputs:
  components:
    description: Comma-separated rustup components to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
