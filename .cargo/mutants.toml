# Each mutant runs only its own crate's tests, so each crate's tests must
# catch its own mutants.
test_workspace = false

# Mutants build without debug info: see the mutants profile in Cargo.toml.
profile = "mutants"

# CI builds with RUSTFLAGS="-D warnings". A mutant such as `fn f(x) -> Ok(())`
# leaves a parameter unused, and that warning would fail its build and mark
# it unviable, untested. Capping lints keeps those mutants tested; the lint
# job still denies warnings in the real code.
cap_lints = true

# The sungma-dynamodb tests make a table per test and per property case, so
# under parallel mutants they run well past the timeout cargo-mutants sets
# from one baseline run.
minimum_test_timeout = 180

# The tests every table runs, and the test node: test code, not
# code under test.
exclude_globs = [
    "crates/sungma-write/src/testkit.rs",
    "crates/sungma-table/src/testkit.rs",
    "crates/sungma-node/src/testkit.rs",
]

# Mutants no test should catch.
exclude_re = [
    # Default::default() for a Vec is Vec::new().
    "impl Proof for Vec<Fact>>::empty",
    # Only the wording of a serde error that a namespace document's visitors,
    # which accept every JSON value they are offered, never raise.
    "impl Visitor<'de> for (Text|Json|Leaf)Visitor(<V>)?>::expecting",
    # The adjtimex call itself: what it returns depends on the host's sync.
    'linux\.rs:.*replace read ->',
    # Compiled only by cargo-fuzz, which builds with --cfg fuzzing.
    "fuzz_(answer|ke_response|fields|verify)",
    # Compiled only off Linux, and CI runs mutants on Linux.
    "replace since_start -> u64",
    # The next read drives any TLS bytes a no-op flush leaves pending, so
    # no test can tell the difference.
    "impl Write for Deadline>::flush",
    # A lookup exactly as old as the stale limit, to the nanosecond, is
    # either side of it; no test can time one that closely.
    'servers\.rs:.*replace < with <= in Lookups::start',
    # Whether a read asks DynamoDB for consistency: DynamoDB Local reads
    # every item consistently, so no test can tell the difference.
    'items\.rs:.*replace == with != in <impl ItemReader for DynamoTable>',
]
