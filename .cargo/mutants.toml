# Every mutant runs every crate's tests: sungma-lang's tests check the core
# code its parsers call, such as theory checks and names.
test_workspace = true

# Mutants no test should catch.
exclude_re = [
    # Default::default() for a Vec is Vec::new().
    "impl Proof for Vec<Fact>>::empty",
    # Only the wording of a serde error that a theory document's visitors,
    # which accept every JSON value they are offered, never raise.
    "impl Visitor<'de> for (Text|Json|Leaf)Visitor(<V>)?>::expecting",
]
