[package]
name = "sungma-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sungma = { path = "../crates/sungma" }
sungma-clock = { path = "../crates/sungma-clock" }
sungma-lang = { path = "../crates/sungma-lang" }
sungma-memory = { path = "../crates/sungma-memory" }

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fact"
path = "fuzz_targets/fact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntp"
path = "fuzz_targets/ntp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nts_ke"
path = "fuzz_targets/nts_ke.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nts_fields"
path = "fuzz_targets/nts_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nts_verify"
path = "fuzz_targets/nts_verify.rs"
test = false
