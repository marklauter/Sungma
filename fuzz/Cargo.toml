[package]
name = "sungma-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sungma = { path = "../crates/sungma" }
sungma-clock = { path = "../crates/sungma-clock" }
sungma-lang = { path = "../crates/sungma-lang" }

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fact"
path = "fuzz_targets/fact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntp"
path = "fuzz_targets/ntp.rs"
test = false
doc = false
bench = false
