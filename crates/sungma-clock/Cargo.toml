[package]
name = "sungma-clock"
version.workspace = true
edition.workspace = true

[lints.rust]
# cargo-fuzz builds with --cfg fuzzing, which exposes the fuzz entry points.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[features]
# ManualClock, which a test sets by hand.
test-util = ["tokio/sync"]

[dependencies]
aes-siv.workspace = true
getrandom.workspace = true
rustls.workspace = true
sungma.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
webpki-roots.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
divan.workspace = true
proptest.workspace = true
rcgen.workspace = true
sungma-clock = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[[bench]]
name = "clock"
harness = false
