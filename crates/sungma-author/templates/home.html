{% extends "base.html" %}
{% block title %}Home | Sungma Author{% endblock %}
{% block body %}
<header class="masthead">
<div class="bar">
<a class="brand" href="/">Sungma Author</a>
<span class="muted crumb">/ Home</span>
<details class="menu">
<summary>{{ you.handle }}<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"></path></svg></summary>
<div class="items">
<button type="button" hx-post="/auth/logout">Sign out</button>
</div>
</details>
</div>
</header>
<main class="home">
<section class="panel you" aria-label="You">
<h2>{{ you.name }}</h2>
<span class="subject">
<code title="{{ you.subject }}">{{ you.short }}</code>
<button type="button" class="icon" aria-label="Copy your subject id" title="Copy {{ you.subject }}" data-copy="{{ you.subject }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="8" height="9" rx="1.5"></rect><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H10"></path></svg></button>
</span>
</section>
</main>
{% endblock %}
