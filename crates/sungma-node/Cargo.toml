testkit = []

[dependencies]
serde_json.workspace = true
sungma.workspace = true
sungma-check.workspace = true
sungma-clock.workspace = true
sungma-edge.workspace = true
sungma-lang.workspace = true
sungma-names.workspace = true
sungma-schema.workspace = true
sungma-write.workspace = true
thiserror.workspace = true

[dev-dependencies]
sungma-node = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }
