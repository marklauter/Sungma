[package]
name = "sungma-write"
version.workspace = true
edition.workspace = true

[features]
# The tests every store runs: see `testkit`.
testkit = ["dep:proptest", "dep:sungma-check", "tokio/rt"]

[dependencies]
parking_lot.workspace = true
proptest = { workspace = true, optional = true }
sungma.workspace = true
sungma-check = { workspace = true, optional = true }
sungma-clock.workspace = true
sungma-edge.workspace = true
sungma-names.workspace = true
sungma-schema.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
sungma-node = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }
