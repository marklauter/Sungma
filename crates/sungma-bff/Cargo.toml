[package]
name = "sungma-bff"
version.workspace = true
edition.workspace = true

[features]
# A fake identity provider and a cookie-keeping browser: see `testkit`.
testkit = [
    "dep:base64",
    "dep:parking_lot",
    "dep:rcgen",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower",
    "sungma-clock/test-util",
    "tower-sessions/memory-store",
]

[dependencies]
axum.workspace = true
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.42", default-features = false }
openidconnect = "4.1.0"
parking_lot = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sungma-clock.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "rt"] }
tower = { workspace = true, optional = true, features = ["util"] }
tower-sessions = "0.15.0"

[dev-dependencies]
http-body-util.workspace = true
sungma-bff = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }
